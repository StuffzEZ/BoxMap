<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f0f0f">
  <title>BoxMap - QR Scanner</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>BoxMap</h1>
      <p>Scan QR codes to find items and boxes</p>
    </header>

    <!-- Manual QR Input -->
    <div class="card">
      <div class="card-title">Enter QR Code</div>
      <div class="form-group">
        <div class="manual-input">
          <input type="text" id="qr-input" placeholder="BOX1234567890 or ITM1234567890">
          <button class="btn btn-primary" onclick="scanQR()">Scan</button>
        </div>
      </div>
    </div>

    <!-- QR Code Image Scanner -->
    <div class="card">
      <div class="card-title">Scan QR from Image</div>
      <div class="image-upload-area" id="qr-upload-area">
        <input type="file" id="qr-image-input" accept="image/*" capture="environment" style="display:none" onchange="handleQRImage(event)">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-bottom: 12px; color: var(--text-muted)">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
          <rect x="14" y="14" width="3" height="3"></rect>
          <line x1="21" y1="14" x2="21" y2="14.01"></line>
          <line x1="14" y1="21" x2="14" y2="21.01"></line>
          <line x1="21" y1="21" x2="21" y2="21.01"></line>
          <line x1="21" y1="17.5" x2="21" y2="17.5"></line>
          <line x1="17.5" y1="21" x2="17.5" y2="21"></line>
        </svg>
        <p>Upload Image or Take Photo</p>
        <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 8px">Point camera at a QR code</p>
      </div>
      <canvas id="qr-canvas" style="display:none"></canvas>
    </div>

    <!-- Image Recognition (if enabled) -->
    <div class="card" id="image-recognition-card" style="display:none">
      <div class="card-title">Image Recognition</div>
      <div class="image-upload-area" id="upload-area">
        <input type="file" id="image-input" accept="image/*" capture="environment" style="display:none" onchange="handleImageUpload(event)">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-bottom: 12px; color: var(--text-muted)">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
        <p>Recognize Item from Photo</p>
        <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 8px">Items only</p>
      </div>
    </div>

    <!-- Scan Result -->
    <div class="card scan-result" id="scan-result">
      <div id="result-content"></div>
    </div>

    <nav class="nav-links">
      <a href="/admin">Admin Panel</a>
    </nav>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // Check if image recognition is enabled
    fetch('/api/settings')
      .then(r => r.json())
      .then(data => {
        if (data.imageRecognitionEnabled) {
          document.getElementById('image-recognition-card').style.display = 'block';
        }
      });

    // If page loaded with ?id=... from external QR open, auto-scan that id
    (function autoScanIfId() {
      try {
        const run = () => {
          const params = new URLSearchParams(window.location.search);
          const id = params.get('id');
          if (id) {
            document.getElementById('qr-input').value = id.trim();
            setTimeout(() => scanQR(), 250);
          }
        };
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run); else run();
      } catch (e) {
        // ignore
      }
    })();

    // QR Code Image Scanner
    function handleQRImage(event) {
      const file = event.target.files[0];
      if (!file) return;

      const img = new Image();
      const reader = new FileReader();

      reader.onload = function(e) {
        img.onload = function() {
          const canvas = document.getElementById('qr-canvas');
          const ctx = canvas.getContext('2d');

          // Resize large images to improve detection reliability and performance
          const MAX_DIM = 1024;
          let sw = img.width;
          let sh = img.height;
          if (Math.max(sw, sh) > MAX_DIM) {
            const scale = MAX_DIM / Math.max(sw, sh);
            sw = Math.round(sw * scale);
            sh = Math.round(sh * scale);
          }

          canvas.width = sw;
          canvas.height = sh;
          ctx.clearRect(0, 0, sw, sh);
          ctx.drawImage(img, 0, 0, sw, sh);

          let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

          // Try detection with both inversion attempts
          let code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'attemptBoth' });

          // If not found, try rotated variants to handle EXIF orientation issues
          function tryRotateAndDetect(rotDegrees) {
            const tmp = document.createElement('canvas');
            const tctx = tmp.getContext('2d');
            if (rotDegrees % 180 === 0) {
              tmp.width = canvas.width;
              tmp.height = canvas.height;
            } else {
              tmp.width = canvas.height;
              tmp.height = canvas.width;
            }
            tctx.save();
            // move origin to center
            tctx.translate(tmp.width / 2, tmp.height / 2);
            tctx.rotate(rotDegrees * Math.PI / 180);
            // draw the original image centered
            tctx.drawImage(canvas, -canvas.width / 2, -canvas.height / 2, canvas.width, canvas.height);
            tctx.restore();
            const rotatedData = tctx.getImageData(0, 0, tmp.width, tmp.height);
            return jsQR(rotatedData.data, rotatedData.width, rotatedData.height, { inversionAttempts: 'attemptBoth' });
          }

          if (!code) {
            code = tryRotateAndDetect(90) || tryRotateAndDetect(270);
          }

          if (code) {
            document.getElementById('qr-input').value = code.data;
            scanQR();
            showToast('QR code detected: ' + code.data, 'success');
          } else {
            showToast('No QR code found in image', 'error');
          }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
      event.target.value = '';
    }

    document.getElementById('qr-upload-area')?.addEventListener('click', () => {
      document.getElementById('qr-image-input').click();
    });

    // Normalize input: if a full URL with ?id=... is provided, extract the id param
    function extractIdFromInput(raw) {
      if (!raw) return '';
      raw = raw.trim();
      // Try URL parsing first
      try {
        const u = new URL(raw, window.location.origin);
        const idParam = u.searchParams.get('id');
        if (idParam) return idParam.trim();
      } catch (e) {
        // not an absolute url, continue
      }
      // Fallback: look for '?id=' in the string
      const qIdx = raw.indexOf('?id=');
      if (qIdx !== -1) {
        let after = raw.substring(qIdx + 4);
        const amp = after.indexOf('&');
        if (amp !== -1) after = after.substring(0, amp);
        return decodeURIComponent(after).trim();
      }
      return raw;
    }

    // Scan QR
    async function scanQR() {
      let input = document.getElementById('qr-input').value.trim();
      if (!input) {
        showToast('Please enter a QR code', 'error');
        return;
      }

      const id = extractIdFromInput(input);
      // Replace the input with the normalized id for clarity
      document.getElementById('qr-input').value = id;

      try {
        const res = await fetch('/api/scan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ qr_code: id })
        });
        const data = await res.json();
        displayResult(data);
      } catch (err) {
        showToast('Error scanning QR code', 'error');
      }
    }

    function displayResult(data) {
      const resultDiv = document.getElementById('scan-result');
      const contentDiv = document.getElementById('result-content');

      if (!data.found) {
        resultDiv.className = 'card scan-result not-found';
        contentDiv.innerHTML = `
          <h3>${data.type.toUpperCase()} Not Found</h3>
          <p style="color: var(--text-secondary)">No ${data.type} found with ID: ${data.id}</p>
        `;
        return;
      }

      resultDiv.className = 'card scan-result found';

      if (data.type === 'box') {
        const itemsHtml = data.items && data.items.length > 0 
          ? `<div class="items-list">
              <h4>Items in this box (${data.items.length})</h4>
              <div class="items-grid">
                ${data.items.map(item => `
                  <div class="item-chip" onclick="document.getElementById('qr-input').value='${item.id}'; scanQR();" style="cursor:pointer">
                    <div class="name">${item.name}</div>
                    <div class="id">${item.id}</div>
                  </div>
                `).join('')}
              </div>
            </div>`
          : '<p style="color: var(--text-muted); margin-top: 12px">No items in this box</p>';

        contentDiv.innerHTML = `
          <div class="result-header">
            ${data.data.image ? `<img src="${data.data.image}" class="result-image" alt="${data.data.name}">` : ''}
            <div>
              <h3>Box Found</h3>
              <p style="color: var(--text-secondary)">${data.data.name}</p>
            </div>
          </div>
          <div class="detail"><span class="label">ID</span><span class="value">${data.data.id}</span></div>
          <div class="detail"><span class="label">Description</span><span class="value">${data.data.description || '-'}</span></div>
          <div class="detail"><span class="label">Unit</span><span class="value">${data.unit ? (data.unit.name + ' (' + data.unit.id + ')') : '-'}</span></div>
          ${itemsHtml}
        `;
      } else {
        contentDiv.innerHTML = `
          <div class="result-header">
            ${data.data.image ? `<img src="${data.data.image}" class="result-image" alt="${data.data.name}">` : ''}
            <div>
              <h3>Item Found</h3>
              <p style="color: var(--text-secondary)">${data.data.name}</p>
            </div>
          </div>
          <div class="detail"><span class="label">ID</span><span class="value">${data.data.id}</span></div>
          <div class="detail"><span class="label">Description</span><span class="value">${data.data.description || '-'}</span></div>
          <div class="detail"><span class="label">Stored in Box</span><span class="value">${data.box ? `<span style="cursor:pointer; color:var(--accent)" onclick="document.getElementById('qr-input').value='${data.box.id}'; scanQR();">${data.box.name} (${data.box.id})</span>` : 'Not assigned'}</span></div>
          <div class="detail"><span class="label">Unit</span><span class="value">${data.unit ? (data.unit.name + ' (' + data.unit.id + ')') : '-'}</span></div>
        `;
        // show popup for item found
        try { showFoundPopup({ item: data.data, box: data.box, unit: data.unit }); } catch(e) {}
      }
    }

    function showFoundPopup(obj) {
      // create overlay
      const existing = document.getElementById('found-popup');
      if (existing) existing.remove();
      const overlay = document.createElement('div');
      overlay.id = 'found-popup';
      overlay.style.position = 'fixed';
      overlay.style.left = '50%';
      overlay.style.top = '10%';
      overlay.style.transform = 'translateX(-50%)';
      overlay.style.zIndex = 9999;
      overlay.style.background = 'linear-gradient(180deg,#fff,#f7f7f7)';
      overlay.style.border = '1px solid #ccc';
      overlay.style.boxShadow = '0 6px 18px rgba(0,0,0,0.12)';
      overlay.style.padding = '12px 14px';
      overlay.style.borderRadius = '8px';
      overlay.style.minWidth = '260px';
      overlay.style.maxWidth = '90%';

      const html = `
        <div style="display:flex;align-items:center;gap:12px">
          ${obj.item && obj.item.image ? `<img src="${obj.item.image}" style="width:64px;height:64px;object-fit:cover;border-radius:6px">` : ''}
          <div>
            <div style="font-weight:700">${obj.item.name}</div>
            <div style="font-size:0.9rem;color:#333">${obj.item.id}</div>
            <div style="font-size:0.85rem;color:#666;margin-top:6px">Box: ${obj.box ? obj.box.name + ' ('+obj.box.id+')' : 'Not assigned'}</div>
            <div style="font-size:0.85rem;color:#666">Unit: ${obj.unit ? obj.unit.name + ' ('+obj.unit.id+')' : '-'}</div>
          </div>
        </div>
      `;
      overlay.innerHTML = html;
      overlay.addEventListener('click', () => overlay.remove());
      document.body.appendChild(overlay);
      setTimeout(() => { try { overlay.remove(); } catch(e){} }, 6000);
    }

    // Image Recognition
    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append('image', file);

      fetch('/api/recognize', {
        method: 'POST',
        body: formData
      })
      .then(r => r.json())
      .then(data => {
        if (data.error) {
          showToast(data.error, 'error');
          return;
        }

        // Determine candidates: prefer automatic matches, then items, then allCandidates
        const candidates = (data.matches && data.matches.length) ? data.matches : (data.items || data.allCandidates || []);

        const resultDiv = document.getElementById('scan-result');
        const contentDiv = document.getElementById('result-content');
        
        resultDiv.className = 'card scan-result found';
        contentDiv.innerHTML = `
          <h3 style="margin-bottom: 12px">Select Matching Item</h3>
          <div style="margin-bottom: 16px">
            <img src="${data.imageUrl}" style="max-width: 100%; max-height: 200px; border-radius: 8px; border: 1px solid var(--border);">
          </div>
          <p style="color: var(--text-secondary); margin-bottom: 12px; font-size: 0.9rem;">Tap the item that matches this image:</p>
          <div class="items-grid">
            ${candidates.map(item => `
              <div class="item-chip" onclick="document.getElementById('qr-input').value='${item.id}'; scanQR();" style="cursor: pointer; display: flex; align-items: center; gap: 10px;">
                ${item.image ? `<img src="${item.image}" style="width: 40px; height: 40px; border-radius: 6px; object-fit: cover;">` : ''}
                <div>
                  <div class="name">${item.name}</div>
                  <div class="id">${item.id} ${item.distance !== undefined ? '• score: ' + item.distance : ''}</div>
                </div>
              </div>
            `).join('')}
          </div>
          ${candidates.length === 0 ? '<p style="color: var(--text-muted); text-align: center; padding: 20px;">No items with images found</p>' : ''}
        `;
      })
      .catch(err => {
        showToast('Error uploading image', 'error');
      });
      
      event.target.value = '';
    }

    document.getElementById('upload-area')?.addEventListener('click', () => {
      document.getElementById('image-input').click();
    });

    // Enter key to scan
    document.getElementById('qr-input')?.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') scanQR();
    });

    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `toast show ${type}`;
      setTimeout(() => toast.className = 'toast', 3000);
    }
  </script>
</body>
</html>
