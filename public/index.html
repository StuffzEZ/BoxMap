<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f0f0f">
  <title>BoxMap - QR Scanner</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>BoxMap</h1>
      <p>Scan QR codes to find items and boxes</p>
    </header>

    <!-- Manual QR Input -->
    <div class="card">
      <div class="card-title">Scan QR Code</div>
      <div class="form-group">
        <label>Enter QR Code</label>
        <div class="manual-input">
          <input type="text" id="qr-input" placeholder="BOX1234567890 or ITM1234567890">
          <button class="btn btn-primary" onclick="scanQR()">Scan</button>
        </div>
      </div>
    </div>

    <!-- Quick Select -->
    <div class="card">
      <div class="card-title">Quick Select</div>
      <div class="form-group">
        <label>Choose a box or item</label>
        <select id="quick-select" onchange="quickSelect()">
          <option value="">Select...</option>
          <optgroup label="Boxes" id="boxes-group"></optgroup>
          <optgroup label="Items" id="items-group"></optgroup>
        </select>
      </div>
    </div>

    <!-- Image Recognition (if enabled) -->
    <div class="card" id="image-recognition-card" style="display:none">
      <div class="card-title">Image Recognition</div>
      <div class="image-upload-area" id="upload-area">
        <input type="file" id="image-input" accept="image/*" capture="environment" style="display:none" onchange="handleImageUpload(event)">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-bottom: 12px; color: var(--text-muted)">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
        <p>Upload Image or Take Photo</p>
        <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 8px">Items only</p>
      </div>
    </div>

    <!-- Scan Result -->
    <div class="card scan-result" id="scan-result">
      <div id="result-content"></div>
    </div>

    <nav class="nav-links">
      <a href="/admin">Admin Panel</a>
    </nav>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let boxes = [];
    let items = [];

    // Load data for quick select
    async function loadData() {
      try {
        const [boxesRes, itemsRes, settingsRes] = await Promise.all([
          fetch('/api/boxes'),
          fetch('/api/items'),
          fetch('/api/settings')
        ]);
        boxes = await boxesRes.json();
        items = await itemsRes.json();
        const settings = await settingsRes.json();

        renderQuickSelect();

        if (settings.imageRecognitionEnabled) {
          document.getElementById('image-recognition-card').style.display = 'block';
        }
      } catch (err) {
        console.error('Error loading data:', err);
      }
    }

    function renderQuickSelect() {
      const boxesGroup = document.getElementById('boxes-group');
      const itemsGroup = document.getElementById('items-group');

      boxesGroup.innerHTML = boxes.map(b => 
        `<option value="${b.id}">${b.name} (${b.id})</option>`
      ).join('');

      itemsGroup.innerHTML = items.map(i => 
        `<option value="${i.id}">${i.name} (${i.id})</option>`
      ).join('');
    }

    function quickSelect() {
      const select = document.getElementById('quick-select');
      const id = select.value;
      if (!id) return;

      document.getElementById('qr-input').value = id;
      scanQR();
      select.value = '';
    }

    async function scanQR() {
      const input = document.getElementById('qr-input').value.trim();
      if (!input) {
        showToast('Please enter a QR code', 'error');
        return;
      }

      try {
        const res = await fetch('/api/scan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ qr_code: input })
        });
        const data = await res.json();
        displayResult(data);
      } catch (err) {
        showToast('Error scanning QR code', 'error');
      }
    }

    function displayResult(data) {
      const resultDiv = document.getElementById('scan-result');
      const contentDiv = document.getElementById('result-content');

      if (!data.found) {
        resultDiv.className = 'card scan-result not-found';
        contentDiv.innerHTML = `
          <h3>${data.type.toUpperCase()} Not Found</h3>
          <p style="color: var(--text-secondary)">No ${data.type} found with ID: ${data.id}</p>
        `;
        return;
      }

      resultDiv.className = 'card scan-result found';

      if (data.type === 'box') {
        const itemsHtml = data.items && data.items.length > 0 
          ? `<div class="items-list">
              <h4>Items in this box (${data.items.length})</h4>
              <div class="items-grid">
                ${data.items.map(item => `
                  <div class="item-chip" onclick="document.getElementById('qr-input').value='${item.id}'; scanQR();" style="cursor:pointer">
                    <div class="name">${item.name}</div>
                    <div class="id">${item.id}</div>
                  </div>
                `).join('')}
              </div>
            </div>`
          : '<p style="color: var(--text-muted); margin-top: 12px">No items in this box</p>';

        contentDiv.innerHTML = `
          <div class="result-header">
            ${data.data.image ? `<img src="${data.data.image}" class="result-image" alt="${data.data.name}">` : ''}
            <div>
              <h3>Box Found</h3>
              <p style="color: var(--text-secondary)">${data.data.name}</p>
            </div>
          </div>
          <div class="detail"><span class="label">ID</span><span class="value">${data.data.id}</span></div>
          <div class="detail"><span class="label">Description</span><span class="value">${data.data.description || '-'}</span></div>
          ${itemsHtml}
        `;
      } else {
        contentDiv.innerHTML = `
          <div class="result-header">
            ${data.data.image ? `<img src="${data.data.image}" class="result-image" alt="${data.data.name}">` : ''}
            <div>
              <h3>Item Found</h3>
              <p style="color: var(--text-secondary)">${data.data.name}</p>
            </div>
          </div>
          <div class="detail"><span class="label">ID</span><span class="value">${data.data.id}</span></div>
          <div class="detail"><span class="label">Description</span><span class="value">${data.data.description || '-'}</span></div>
          <div class="detail"><span class="label">Location</span><span class="value">${data.data.location || '-'}</span></div>
          <div class="detail">
            <span class="label">Stored in Box</span>
            <span class="value">${data.box ? `<span style="cursor:pointer; color:var(--accent)" onclick="document.getElementById('qr-input').value='${data.box.id}'; scanQR();">${data.box.name} (${data.box.id})</span>` : 'Not assigned'}</span>
          </div>
        `;
      }
    }

    // Image Recognition
    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append('image', file);

      fetch('/api/recognize', {
        method: 'POST',
        body: formData
      })
      .then(r => r.json())
      .then(data => {
        if (data.error) {
          showToast(data.error, 'error');
        } else {
          showToast('Image uploaded successfully', 'success');
        }
      })
      .catch(err => {
        showToast('Error uploading image', 'error');
      });
    }

    document.getElementById('upload-area')?.addEventListener('click', () => {
      document.getElementById('image-input').click();
    });

    // Enter key to scan
    document.getElementById('qr-input')?.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') scanQR();
    });

    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `toast show ${type}`;
      setTimeout(() => toast.className = 'toast', 3000);
    }

    // Initialize
    loadData();
  </script>
</body>
</html>
