version: '3.8'

services:
  boxmap:
    build: .
    container_name: boxmap
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    environment:
      - ADMIN_PASSWORD=admin123
      - PORT=3000
      - IMAGE_RECOGNITION_ENABLED=false
    restart: unless-stopped
