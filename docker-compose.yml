services:
  boxmap:
    build: .
    container_name: boxmap
    ports:
      - "3000:3000"
    volumes:
      - boxmap-data:/app/data
      - boxmap-uploads:/app/uploads
    environment:
      - ADMIN_PASSWORD=admin123
      - PORT=3000
      - IMAGE_RECOGNITION_ENABLED=false
    restart: unless-stopped

volumes:
  boxmap-data:
  boxmap-uploads:
